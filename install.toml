# What installing the brain on a fresh machine needs, read by the testbed's install verb (bmo-testbed's
# docs/install.md, 「The install declaration」). The configuration is docs/boundary-api.md's 「Configuration」; the
# tool host the deploy steps register the tools with is deployed before this unit.

install = 1

# The service's one user unit.
restart = "systemctl --user restart bmo-brain.service"

[[needs]]
program = "cargo"
what = "Rust's Cargo, which builds the service and its tools at every release: `curl https://sh.rustup.rs -sSf | sh`."

[[needs]]
program = "bun"
what = "Bun, which installs and builds the console bundle at every release and checks the TypeScript client and the bundle in the suite: `curl -fsSL https://bun.sh/install | bash`."

[[needs]]
program = "pg_isready"
what = "PostgreSQL, the server the brain's own database stands on, reached on its local socket by the user the install runs as, who may create databases for the suite's scratch ones: the `postgresql` package."

[[port]]
name = "brain.server"
number = 3250

# The service's token, which every caller but the console presents.
[[token]]
name = "brain.service"
file = "env/brain-service.token"

# The console's own credential, which reaches the console bundle and the routes the screen uses.
[[token]]
name = "brain.console"
file = "env/brain-console.token"

# The name the embedding model is registered under in the LLM gateway. Where the gateway holds no such
# registration, every search is by words alone and the brain keeps asking after a pause.
[[input]]
name = "brain.embedding-model"
what = "The name an embedding model of 1024-dimension vectors is registered under in agency's LLM gateway, as the gateway's model list shows it; leave the default where none is registered yet."
file = "install/inputs/brain.embedding-model"
default = "embedding"

[[database]]
name = "bmo_brain"

# The configuration each release links to as brain.toml. The tool-env deploy step writes env/brain.env under the
# data root from it, where the brain's tool and its other callers read the address and token. The screen
# translates through the gate.
[[settings]]
file = "env/brain.toml"
text = '''
listen = "127.0.0.1:{{port.brain.server}}"
token = "{{token.brain.service}}"
database = "postgres:///bmo_brain?host=/var/run/postgresql"
data_root = "{{data_root}}"

[console]
token = "{{token.brain.console}}"
calls = ["gate"]

[embedding]
address = "http://127.0.0.1:{{port.agency.gateway}}"
key_file = "{{data_root}}/env/llm-gateway.key"
model = "{{input.brain.embedding-model}}"
'''

# The console reaches the brain's screen with its own credential, and the organisations' memory tab with the
# service's token (bmo-web's docs/boundary.md, 「Settings」).
[[line]]
file = "env/web-console.env"
key = "BRAIN_ADDRESS"
value = "http://127.0.0.1:{{port.brain.server}}"

[[line]]
file = "env/web-console.env"
key = "BRAIN_TOKEN"
value = "{{token.brain.console}}"

[[line]]
file = "env/web-console.env"
key = "ORG_BRAIN_ADDRESS"
value = "http://127.0.0.1:{{port.brain.server}}"

[[line]]
file = "env/web-console.env"
key = "ORG_BRAIN_TOKEN"
value = "{{token.brain.service}}"
