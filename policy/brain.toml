# The brain's own numbers.

# A memory row's withering and a still state's release (docs/memories.md): how long a row may wait on its
# condition before it withers, how often a room is looked over for that, and how long a state may stand
# still before it is released.
[memories]
wither_after_seconds = 5184000
wither_every_seconds = 3600
state_idle_seconds = 43200
# What a state released for standing still is checked off with, a code with its parameters: `{hours}` is
# how long it stood.
released = "stood-still hours={hours}"

# How long a standing sheet attached on every turn of its speaker may be, in characters (docs/people-book.md):
# a person's common sheet and a room's sheet of them. A sheet over its ceiling is passed over.
[sheets]
common_ceiling = 8000
room_ceiling = 6000
