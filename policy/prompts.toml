# The Korean words the recollectors' prompts quote (docs/boundary-api.md, 「Its prompts」): a prompt file names each
# by its `{{name}}` mark, and the mark is filled with the word here before the prompt goes out, so the writer reads
# the word itself.

[words]
# What a person is called by in a room: the form of address.
ko_address = "호칭"
# Two sentence endings that show how a person talks.
ko_ending_a = "~바람"
ko_ending_b = "~니당"
# The polite and the plain speech levels.
ko_speech_levels = "존댓말/반말"
# Forms of address English would blur.
ko_elder_brother = "형"
ko_elder_sister = "언니"
# How a room says what an agent is to do from now on.
ko_from_now_on = "「다음부터는 …」, 「앞으로 … 할 때는」, 「그거 시키면 이렇게 해」"
# A working request a person makes of an agent.
ko_working_request = "다음부터 이렇게 해줘"
# The Korean headings an older chunk carries, and what each becomes.
ko_facts = "사실"
ko_views = "견해"
ko_judgements = "판단"
ko_rules = "규칙"
ko_source_room = "출처 방"
# The Korean slot names of an older item's day bracket.
ko_date = "일자"
ko_basis = "근거"
ko_confirmed = "확인"
ko_unknown = "미상"
# The words that name a situation in a title.
ko_when = "때"
ko_case = "경우"
# A person's address piece's keywords, as an example: a name with its address, and the address words.
ko_address_keywords = "철수형, 호칭, 형님"
# The speaker a session's transcript names the room by.
ko_room = "방"
