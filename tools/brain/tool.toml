# The brain's tool: what a chat agent writes to and reads from its brain in a turn (docs/boundary-api.md, 「Its
# tool」), each entry one call of a brain route through the brain's client, and the narrower form of three of them a
# run working for a chat agent holds to read that brain and write its lessons. The tool finds the brain through the
# data root's env file, and the agent's brain by the turn's agent. The crate's own test holds every entry here to
# the executable answering it. Every entry is unbounded: a call waits for the brain's answer however long it
# takes.

[tool]
name = "brain"
protocol = 1
language = "rust"
build = 'cargo build --release -p brain-tool && cp "$BMO_CARGO_TARGET/release/brain-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p brain-tool'
run = ["brain-tool"]
timeout = 60

[[entry]]
namespace = "bmo"
name = "brain_episode"
title = "Keep an episode"
description = "Keep what was just said as an episode of your brain, its text in English: who said it, the room, and an importance from 1 to 10."
input = "brain_episode.json"
hints = { idempotent = false }
capabilities = ["room.chat"]
unbounded = true

[[entry]]
namespace = "bmo"
name = "brain_similar"
title = "Likes of a candidate"
description = "The live memories most like a candidate fact: read these and judge the candidate before brain_learn. Under base stand the platform's shared memories most like it, which you read but never write, strengthen or replace."
input = "brain_similar.json"
hints = { read_only = true }
capabilities = ["room.chat"]
unbounded = true

[entry.bundle."brain.lessons"]
shown = ["text", "subjects", "limit"]

[[entry]]
namespace = "bmo"
name = "brain_learn"
title = "Learn"
description = "Apply a learning whole, one fact to a call, its text in English: confirm the memories it repeats, version the one it strengthens, close the ones it contradicts (unless heard), and write it as a fact or a rumor by its source. A person's sheet is rendered from these facts; no sheet is written."
input = "brain_learn.json"
hints = { idempotent = false }
capabilities = ["room.chat"]
unbounded = true

[entry.bundle."brain.lessons"]
shown = ["type", "text", "subjects", "importance", "source", "confirms", "strengthens", "replaces", "key", "recallCondition", "releaseCondition"]

[[entry]]
namespace = "bmo"
name = "brain_move"
title = "Move a memory"
description = "Move a memory's status: done for a promise kept, invalidated for a fact that stopped holding, active to approve a pending one."
input = "brain_move.json"
hints = { idempotent = true }
capabilities = ["room.chat"]
unbounded = true

[[entry]]
namespace = "bmo"
name = "brain_list"
title = "List memories"
description = "Your brain's memories by type, status, subject, key, words, or the situation they are for. Under base stand the platform's shared memories the same ask finds, which you read but never write, strengthen or replace."
input = "brain_list.json"
hints = { read_only = true }
capabilities = ["room.chat"]
unbounded = true

[entry.bundle."brain.lessons"]
shown = ["type", "status", "subject", "key", "words", "situation", "limit"]

[[entry]]
namespace = "bmo"
name = "brain_unconsolidated"
title = "Unconsolidated episodes"
description = "The episodes not yet consolidated, highest priority first, for a consolidation."
input = "brain_unconsolidated.json"
hints = { read_only = true }
capabilities = ["room.chat"]
unbounded = true

[[entry]]
namespace = "bmo"
name = "brain_consolidated"
title = "Mark consolidated"
description = "Mark episodes consolidated after writing what they come to."
input = "brain_consolidated.json"
hints = { idempotent = true }
capabilities = ["room.chat"]
unbounded = true

[[entry]]
namespace = "bmo"
name = "brain_fold"
title = "Fold"
description = "Tell the brain this session folds or is handed off: its marks clear, so what it knew may attach to the next session."
input = "brain_fold.json"
hints = { idempotent = true }
capabilities = ["room.chat"]
unbounded = true

[[entry]]
namespace = "bmo"
name = "brain_duplicates"
title = "Duplicate candidates"
description = "Pairs of your live memories about one subject that stand close in meaning or words, closest first: judge each pair, then merge them with brain_merge, write the fuller one with brain_learn's strengthens, invalidate the older or worse grounded of a contradiction with brain_move, or leave a distinct pair as it is."
input = "brain_duplicates.json"
hints = { read_only = true }
capabilities = ["room.chat"]
unbounded = true

[[entry]]
namespace = "bmo"
name = "brain_merge"
title = "Merge memories"
description = "Write one memory, its text in English, over two or more live memories that say one thing: each is superseded by it, and it keeps the most use they had earned."
input = "brain_merge.json"
hints = { idempotent = false }
capabilities = ["room.chat"]
unbounded = true
