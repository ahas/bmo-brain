# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "brain"

[test]
# The Cargo workspace's crates, and the two Bun projects: the TypeScript client under package/ and the console
# bundle under client/, each with a check script of its typecheck and its tests.
languages = ["cargo", "bun"]
# A fresh tree gets each project's locked packages through the same frozen install its check step runs; the
# service's console test reads its manifest through client/'s copy of bmo-ui.
setup = ["cd package && bun install --frozen-lockfile", "cd client && bun install --frozen-lockfile"]

# The tests make their own scratch databases on the server, so no template is named.
[test.database]

# The TypeScript client under package/ and the console bundle under client/, each a project of its own with
# its manifest and lockfile; bun runs their check scripts in the suite, and the check steps below run the same
# install and check in the static check. The service's own tests stay the Cargo suite's.
[projects]
paths = ["package", "client"]

# The brain's own tool, checked by the command its tool.toml names.
[tools]
dir = "tools"

[check]
quick = ["layout", "dependencies", "cargo-profile"]
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui"]

[[check.step]]
id = "check"
command = "cargo check --workspace --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --workspace --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --all --check"

# The TypeScript client: its types as docs/openapi.json generates them now, its typecheck and its tests.
[[check.step]]
id = "brain-client"
command = "bun install --frozen-lockfile && bun run check"
dir = "package"

# The console bundle: its typecheck and its tests.
[[check.step]]
id = "brain-console"
command = "bun install --frozen-lockfile && bun run check"
dir = "client"
lane = "wide"

[build]
# The service's binary, which also starts the harness plugin's MCP server, and the tool host's tool.
binaries = ["bmo-brain", "brain-tool"]

# The console bundle the service serves (docs/boundary-api.md, 「The console bundle」), built in the build tree,
# where its install and Nuxt's generated project stay warm between deployments, and written into the release
# being built: the release beside the build tree, named by the first twelve hex digits of the commit. Its
# console/ is the folder the service reads its bundle from where the configuration names none, read once as
# it starts.
[[build.step]]
id = "console-install"
dir = "client"
command = "bun install --frozen-lockfile"

[[build.step]]
id = "console-bundle"
dir = "client"
lane = "wide"
command = "BMO_BRAIN_CONSOLE_OUT=\"$(git rev-parse --show-toplevel)/../deploy-releases/$(git rev-parse HEAD | cut -c1-12)/console\" bun run bundle"

# The brain's own deploy tree, and the data root its configuration stands under: env/brain.toml, which each
# release links to as brain.toml (docs/boundary-api.md, 「Configuration」).
[deploy]
root = "~/.local/share/bmo-brain"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "brain.toml", target = "env/brain.toml" }]
# The service's user unit, marked bot: the repository's one service, whose health the deployment waits on.
units = ["deploy/*.service"]
# Answers 0 once the service the deployed configuration names answers ready (docs/boundary-api.md,
# 「Configuration」).
health = "~/.local/share/bmo-brain/deploy/bin/bmo-brain --config ~/.local/share/bmo-brain/deploy/brain.toml health"
# Answers 0 where no chat turn or research run stands under way that the restart would cut: the receiver's
# own `quiet` command, by its deployed path, waited on before the flip (the testbed's docs/deploy.md).
quiet = "~/.local/share/bmo-receiver/deploy/bin/bmo-receiver --config ~/.local/share/bmo-receiver/deploy/settings.toml quiet"

# Where the brain's tool finds it: the data root's env/brain.env, written from the configuration.
[[deploy.step]]
id = "tool-env"
phase = "before-flip"
command = "bin/bmo-brain --config brain.toml tool-env"

# The tool placed in its folder's .placed/, the folder the tool host reads: the executable the release's bin/
# holds, its manifest and the schemas beside it.
[[deploy.step]]
id = "place-brain-tool"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/brain/.placed
mkdir -p tools/brain/.placed
cp bin/brain-tool tools/brain/tool.toml tools/brain/*.json tools/brain/.placed/
'''

# The placed tool registered with the tool host under this service's name, so every release carries its
# tool without a hand on the registry; the host's command stands in its own deploy tree.
[[deploy.step]]
id = "register-brain-tool"
phase = "after-health"
command = '''
set -eu
"$HOME/.local/share/bmo-pocket/deploy/bin/bmo-pocket" put --service brain --placed --allow room.chat tools/brain/.placed
'''
