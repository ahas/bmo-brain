[package]
name = "tool-call"
description = "The brain's side of the tool host's call protocol, which the brain's tools share."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# The brain's address and token, where a tool reads them from the data root's env file.
dotenvy.workspace = true
# The brain's routes a tool answers through.
reqwest.workspace = true
# Each entry's input schema, as the manifest's schema file must hold it.
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The manifest a tool's tests hold to the executable.
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
