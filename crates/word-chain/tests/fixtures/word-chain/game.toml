# The book the game tests play from, and the words each test plays by what it is for.
#
# Of the syllables a round opens from, only the opening word starts with one, so every round opens on it or
# on nothing. The hanbang word leaves nothing to answer, the loanword is the book's only one, and the word
# under the initial-sound rule hands on its last syllable or that syllable's initial-sound form.
book = ["기차", "차표", "표차", "표범", "범인", "차그릇", "차력", "역량", "양말"]
loanword = "차트"

# The word every round opens on and the syllable it hands on.
opening = "기차"
opening_hands = ["차"]
# A word that follows the opening, the syllable it hands on, and the two words that follow it in turn.
follows = "차표"
follows_hands = ["표"]
after_follows = ["표차", "표범"]
# A word on the chain the book does not hold.
not_in_book = "차차차"
# A word nothing in the book answers.
hanbang = "차그릇"
# A word whose last syllable hands on its initial-sound form too, and a word starting with that form.
initial_sound = "차력"
initial_sound_hands = ["력", "역"]
by_initial_sound = "역량"
# What the player whose move it is says that is not a move: bare consonants, a word with talk after it,
# and one syllable.
not_moves = ["ㅋㅋ", "차표 ㄱㄱ", "차"]
