# Agent names that appear in no tracked file but this one. An agent is named by its registration and the
# service's configuration; tests use neutral names such as agent-a and agent-b. The published repository
# lists no private agent name; the product's own name below is the one it guards.

# Matched as whole words, ignoring case.
words = []

# Matched as whole words with their case kept: the system's own name used as the speaking agent.
exact_words = ["BMO"]

# Matched anywhere: a Korean name takes its particles directly after it, with no space between.
anywhere = ["비모"]

# Terms of another unit's protocol that carry one of the names above as part of themselves and name no agent:
# the testbed's unit key a deployment reads its mark from. Each is set aside before the names are matched.
allowed = ["X-BMO-Deploy"]
