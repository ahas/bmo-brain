# The workspace: the brain service's own package at the root, and the crates it is built from under
# `crates/`. The root package also holds the checks that span the repository in `tests/`.
[workspace]
members = ["crates/brain-support", "crates/memory-rows", "crates/fragment-desk", "crates/word-chain"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
brain-support = { path = "crates/brain-support" }
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
sea-orm = { version = "1.1.17", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sqlx = { version = "0.8.6", default-features = false, features = ["any", "postgres", "sqlite", "runtime-tokio"] }
tempfile = "3.20.0"
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "io-util", "process"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[package]
name = "bmo-brain"
description = "The brain service: memory rows, brain documents and the recollectors that write them."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
brain-support.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
toml.workspace = true
