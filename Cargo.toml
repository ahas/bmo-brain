# The workspace: the brain service's own package at the root, which also holds the checks that span the
# repository in `tests/`, and the client it publishes under `crates/client`.
[workspace]
members = ["crates/client", "tools/brain", "tools/memory"]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.44"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
bmo-brain-client = { path = "crates/client" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.5.40", features = ["derive", "env"] }
futures-util = "0.3.34"
regex = "1.12"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rust-ini = "0.21"
rust-stemmers = "1.2.0"
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = [
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
] }
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[package]
name = "bmo-brain"
description = "The brain service: an agent's long-term memory as brains of subjects, layers and versioned memories, with its harness plugin."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[[bin]]
name = "bmo-brain"
path = "src/main.rs"

[dependencies]
# The routes the service answers on.
axum.workspace = true
# The wire types, and the client the MCP server and the health ask call through.
bmo-brain-client.workspace = true
# The dates a sheet split reads, and the days a sheet and a recall line print.
chrono.workspace = true
# The binary's command line.
clap.workspace = true
# The event stream.
futures-util.workspace = true
# The brain file: a SQLite database written and read on disk.
rusqlite.workspace = true
# The MCP server.
rmcp.workspace = true
# The Snowball stems recall reads a turn's words and a memory's words by.
rust-stemmers.workspace = true
# The OpenAPI document and the tools' schemas.
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# The names the console bundle's module and stylesheet are answered under, which follow their bytes.
sha2.workspace = true
# The service's database and its migrations.
sqlx.workspace = true
tokio.workspace = true
# The configuration file.
toml.workspace = true

[dev-dependencies]
# Routes asked by hand, the event stream among them.
reqwest.workspace = true
# The personal-data forms the repository's check reads.
regex.workspace = true
# The service's unit file, read in its INI shape by the repository's checks.
rust-ini.workspace = true
tokio.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

# Build output kept small: line tables alone for a backtrace, split out, and no incremental cache.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
