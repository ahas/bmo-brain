# The workspace: the brain service's own package at the root, and the crates it is built from under
# `crates/`. The root package also holds the checks that span the repository in `tests/`.
[workspace]
members = ["crates/brain-support", "crates/memory-rows", "crates/fragment-desk"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
brain-support = { path = "crates/brain-support" }
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
fragment-desk = { path = "crates/fragment-desk" }
futures-util = "0.3.34"
libc = "0.2.177"
memory-rows = { path = "crates/memory-rows" }
rand = "0.9.2"
reqwest = { version = "0.13.5", default-features = false }
regex = "1.11.1"
sea-orm = { version = "1.1.17", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1.1.17", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["any", "postgres", "sqlite", "runtime-tokio"] }
tempfile = "3.20.0"
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "io-util", "process"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[package]
name = "bmo-brain"
description = "The brain service: memory rows, brain documents and the recollectors that write them."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# The routes the service answers on.
axum.workspace = true
brain-support.workspace = true
# The moments the editors' prompts show.
chrono.workspace = true
# The row writes an editor run leaves on its desk.
fragment-desk.workspace = true
futures-util.workspace = true
# Whether a lock ticket's process lives, and the account's home a commit's git reads.
libc.workspace = true
# The events a memory row waits on.
memory-rows.workspace = true
# A desk's file name.
rand.workspace = true
# The stretches a document is cut in, a prompt's marks and a sheet's days.
regex.workspace = true
# The ports' calls on the agency, the receiver and the gate.
reqwest.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
sqlx.workspace = true
# The brain folders the editors' tests lay down.
tempfile.workspace = true
# The editors' clocks, run on time a test moves.
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true
